# Fly.io app config — replace `<your-app-name>` after `fly launch`.
# Free-tier tip: keep auto_stop_machines = "stop", min_machines_running = 0.
# Cold starts add ~6-10s to the first request; subsequent requests are fast.

app = "stackscore-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1
