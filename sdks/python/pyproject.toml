[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmint"
version = "0.1.0"
description = "AgentMint SDK — one credit wallet across your whole AI-agent suite. Two calls: authorize() and debit()."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agentmint", "ai", "agents", "billing", "credits", "metering", "wallet"]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/nagarmohnish/revenue_tech"
Repository = "https://github.com/nagarmohnish/revenue_tech"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmint"]
